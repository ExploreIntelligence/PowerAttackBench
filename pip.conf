# Pip mirror configuration consumed by Dockerfile during image build.
# Edit this file then rebuild with:  ./run_task.sh --force-build
# Dockerfile copies this file into the image as /etc/pip.conf.

[global]
# Tsinghua mirror (default, most reliable in mainland China)
index-url = https://pypi.tuna.tsinghua.edu.cn/simple
trusted-host = pypi.tuna.tsinghua.edu.cn

# Alternative domestic mirrors — uncomment one and comment the lines above:
# Aliyun:    index-url = https://mirrors.aliyun.com/pypi/simple/
#            trusted-host = mirrors.aliyun.com
# USTC:      index-url = https://pypi.mirrors.ustc.edu.cn/simple/
#            trusted-host = pypi.mirrors.ustc.edu.cn
# Tencent:   index-url = https://mirrors.cloud.tencent.com/pypi/simple/
#            trusted-host = mirrors.cloud.tencent.com
# Douban:    index-url = https://pypi.douban.com/simple/
#            trusted-host = pypi.douban.com

# To fall back to the official PyPI, comment out index-url and trusted-host.
